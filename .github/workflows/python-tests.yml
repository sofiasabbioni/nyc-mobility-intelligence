name: Python unit tests
on:
  pull_request:
    branches: [sofia/nightlife-map-integration, main]
  push:
    branches: [sofia/nightlife-map-integration, main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
           python-version: '3.12'
      - name: Install tested dependencies
        run: |
           python -m pip install --upgrade pip
           python -m pip install -r requirements-dev.txt
      - name: Run Python unit tests
        run: python -m pytest tests -q

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_runner
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: taxi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_runner -d taxi_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES: "1"
      POSTGRES_HOST: "127.0.0.1"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ci_runner
      POSTGRES_PASSWORD: ci_only_password
      POSTGRES_DB: taxi_ci
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tested dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run PostgreSQL integration tests
        run: python -m pytest tests/test_databases_and_benchmark.py -q -ra
