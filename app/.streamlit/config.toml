# Visual theme of the dashboard (colours, fonts, radius). Light content area, dark navy sidebar.
[theme]
base = "light"
primaryColor = "#2f6fed"
backgroundColor = "#f2f5fb"
secondaryBackgroundColor = "#e8edf8"
textColor = "#0f1b3d"
linkColor = "#2f6fed"
borderColor = "#dfe6f2"
baseRadius = "0.9rem"
font = "sans-serif"
showWidgetBorder = true
dataframeHeaderBackgroundColor = "#eef2fa"

[theme.sidebar]
backgroundColor = "#0b1530"
secondaryBackgroundColor = "#14214a"
textColor = "#e6ecff"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
