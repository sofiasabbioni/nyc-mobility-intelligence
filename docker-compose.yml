name: taxi_project

x-env: &env
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  POSTGRES_DB: ${POSTGRES_DB:-taxi}
  START_MONTH: ${START_MONTH:-2026-04}
  TOTAL_MONTHS: ${TOTAL_MONTHS:-4}
  NIGHT_START: ${NIGHT_START:-18}
  NIGHT_END: ${NIGHT_END:-6}
  SIZES: ${SIZES:-1,2,4}
  BENCH_RUNS: ${BENCH_RUNS:-5}
  BENCH_WARMUPS: ${BENCH_WARMUPS:-2}
  BENCH_SEED: ${BENCH_SEED:-42}
  BENCH_ORDER: ${BENCH_ORDER:-shuffle}
  BUILD_FULL_DATASET: ${BUILD_FULL_DATASET:-0}
  FORCE_REBUILD: ${FORCE_REBUILD:-0}
  DATA_DIR: /data
  RESULTS_DIR: /results

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-taxi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-taxi}"]
      interval: 3s
      timeout: 3s
      retries: 30

  loader:
    build:
      context: .
      dockerfile: loader/Dockerfile
    environment:
      <<: *env
      WITH_ZONE_SHAPES: "1"
    volumes:
      - taxi_data:/data                 # clean files and DuckDB databases (fast Docker volume)
      - ./data/raw:/data/raw            # ORIGINAL files: put yours here, they are used as they are
      - ./data/full:/data/full          # optional combined dataset (BUILD_FULL_DATASET=1)
      - ./results:/results
    depends_on:
      db:
        condition: service_healthy

  benchmark:
    build:
      context: .
      dockerfile: benchmark/Dockerfile
    environment: *env
    volumes:
      - taxi_data:/data:ro
      - ./data/raw:/data/raw:ro
      - ./results:/results
    depends_on:
      db:
        condition: service_healthy
      loader:
        condition: service_completed_successfully

  app:
    build:
      context: ./app
    environment:
      RESULTS_DIR: /results
      NIGHT_START: ${NIGHT_START:-18}
      NIGHT_END: ${NIGHT_END:-6}
      DATA_DIR: /data/raw
    volumes:
      - ./results:/results:ro
      - ./data/raw:/data/raw:ro
    ports:
      - "8501:8501"
    depends_on:
      loader:
        condition: service_completed_successfully

volumes:
  pgdata:
  taxi_data:
